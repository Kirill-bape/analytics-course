# Автоматическая сборка при каждом обновлении ветки main:
#  1) сайт на GitHub Pages — для iPad, MacBook и компьютера (работает и без интернета);
#  2) APK для Android — выкладывается в раздел Releases по постоянной ссылке
#     https://github.com/<имя>/<репозиторий>/releases/latest/download/put-analitika.apk
# Android Studio не нужна: всё собирается на компьютерах GitHub.

name: Сборка сайта и APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Сайт
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Python для работы без интернета (кэш)
        uses: actions/cache@v6
        with:
          path: public/pyodide
          key: pyodide-${{ hashFiles('package-lock.json', 'scripts/fetch-pyodide.mjs') }}

      - name: Установка библиотек
        run: npm ci

      - name: Проверка кода и сборка сайта
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  pages:
    name: Публикация сайта
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  android:
    name: Приложение для Android
    runs-on: ubuntu-latest
    permissions:
      contents: write # чтобы выложить APK в Releases
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Python для работы без интернета (кэш)
        uses: actions/cache@v6
        with:
          path: public/pyodide
          key: pyodide-${{ hashFiles('package-lock.json', 'scripts/fetch-pyodide.mjs') }}

      - name: Установка библиотек
        run: npm ci

      - name: Сборка приложения и копирование в Android-проект
        run: npm run build:android

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::Секрет ANDROID_KEYSTORE_BASE64 не задан — APK подписан временным ключом и не встанет поверх прошлой версии."
          fi

      - name: Сборка APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../put-analitika.apk
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../put-analitika.apk
          fi
          ls -la ../put-analitika.apk

      - uses: actions/upload-artifact@v7
        with:
          name: put-analitika-apk
          path: put-analitika.apk

      - name: Выкладываю APK в Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Версия 1.0.${{ github.run_number }} от $(date -u +%d.%m.%Y). Установка: скачай put-analitika.apk на телефон и открой файл. Новая версия ставится поверх старой, прогресс сохраняется."
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk put-analitika.apk --title "Путь аналитика для Android" --notes "$NOTES" --latest
