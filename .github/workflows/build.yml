# Автоматическая сборка при каждом обновлении ветки main:
#  1) сайт на GitHub Pages — для iPad, MacBook и компьютера (работает и без интернета);
#  2) APK для Android — выкладывается в раздел Releases по постоянной ссылке
#     https://github.com/<имя>/<репозиторий>/releases/latest/download/put-analitika.apk
# Android Studio не нужна: всё собирается на компьютерах GitHub.

name: Сборка сайта и APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Сайт
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Python для работы без интернета (кэш)
        uses: actions/cache@v6
        with:
          path: public/pyodide
          key: pyodide-${{ hashFiles('package-lock.json', 'scripts/fetch-pyodide.mjs') }}

      - name: Установка библиотек
        run: npm ci

      - name: Проверка кода и сборка сайта
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  pages:
    name: Публикация сайта
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  android:
    name: Приложение для Android
    runs-on: ubuntu-latest
    permissions:
      contents: write # чтобы выложить APK в Releases
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Python для работы без интернета (кэш)
        uses: actions/cache@v6
        with:
          path: public/pyodide
          key: pyodide-${{ hashFiles('package-lock.json', 'scripts/fetch-pyodide.mjs') }}

      - name: Установка библиотек
        run: npm ci

      - name: Сборка приложения и копирование в Android-проект
        run: npm run build:android

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Секрет ANDROID_KEYSTORE_BASE64 не задан — APK подписан временным ключом и не встанет поверх прошлой версии."
            exit 0
          fi
          # Пробелы и переносы строк могли попасть в секрет при копировании — убираем их
          KEY=$(printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t')
          PASS=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d ' \r\n\t')
          echo "Длина ключа: ${#KEY} символов (ожидается около 5800), длина пароля: ${#PASS} (ожидается 24)"
          if ! printf '%s' "$KEY" | base64 -d > "$RUNNER_TEMP/release.p12" 2>/dev/null; then
            echo "::error title=Ключ подписи::Секрет ANDROID_KEYSTORE_BASE64 не похож на ключ (длина ${#KEY}). Вставь в него целиком содержимое файла ANDROID_KEYSTORE_BASE64.txt."
            exit 1
          fi
          export PASS
          if ! openssl pkcs12 -in "$RUNNER_TEMP/release.p12" -passin env:PASS -noout 2>/dev/null; then
            echo "::error title=Пароль ключа::Ключ прочитан, но пароль ANDROID_KEYSTORE_PASSWORD к нему не подходит (длина пароля ${#PASS}). Вставь в секрет содержимое файла ANDROID_KEYSTORE_PASSWORD.txt."
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          echo "::add-mask::$PASS"
          echo "ANDROID_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "Ключ подписи в порядке ✓"

      - name: Сборка APK
        working-directory: android
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          set -o pipefail
          chmod +x gradlew
          TASK=assembleDebug
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then TASK=assembleRelease; fi
          if ! ./gradlew "$TASK" --no-daemon 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
            # Короткое описание ошибки — видно на странице сборки без открытия журнала
            MSG=$(grep -A 20 "What went wrong" "$RUNNER_TEMP/gradle.log" | head -30 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Сборка APK не удалась::${MSG:-подробности в журнале шага}"
            exit 1
          fi
          if [ "$TASK" = assembleRelease ]; then
            cp app/build/outputs/apk/release/app-release.apk ../put-analitika.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk ../put-analitika.apk
          fi
          ls -la ../put-analitika.apk

      - uses: actions/upload-artifact@v7
        with:
          name: put-analitika-apk
          path: put-analitika.apk

      - name: Выкладываю APK в Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Версия 1.0.${{ github.run_number }} от $(date -u +%d.%m.%Y). Установка: скачай put-analitika.apk на телефон и открой файл. Новая версия ставится поверх старой, прогресс сохраняется."
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk put-analitika.apk --title "Путь аналитика для Android" --notes "$NOTES" --latest
